services:
  postgres:
    image: postgres:15
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_db}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcare_pass}

    ports:
      - "127.0.0.1:${POSTGRES_EXPOSED_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev

    image: healthcare-ai-agent-dev:latest
    restart: unless-stopped
    init: true
    working_dir: /workspace

    command:
      - bash
      - -lc
      - >
        cmake -S . -B build/compose-debug
        -DCMAKE_BUILD_TYPE=Debug
        &&
        cmake --build build/compose-debug -j2
        &&
        ./build/compose-debug/backend/healthcare_ai_agent

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_db}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcare_pass}
      POSTGRES_CONNECTIONS: 2

    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

    volumes:
      - .:/workspace

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
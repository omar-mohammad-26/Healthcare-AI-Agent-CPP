services:
  postgres:
    image: postgres:15
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_db}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcare_pass}

    ports:
      - "127.0.0.1:${POSTGRES_EXPOSED_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev

    image: healthcare-ai-agent-dev:latest
    restart: unless-stopped
    init: true
    working_dir: /workspace

    command:
      - bash
      - -lc
      - >
        cmake -S . -B build/compose-debug
        -DCMAKE_BUILD_TYPE=Debug
        &&
        cmake --build build/compose-debug -j2
        &&
        ./build/compose-debug/backend/healthcare_ai_agent

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_db}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcare_pass}
      POSTGRES_CONNECTIONS: 2

      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash}"
      GEMINI_BASE_URL: "${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}"

    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

    volumes:
      - .:/workspace

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    init: true
    working_dir: /app

    command:
      - sh
      - -c
      - >
        npm install
        &&
        npm run dev -- --host 0.0.0.0 --port 3000

    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  frontend_node_modules: